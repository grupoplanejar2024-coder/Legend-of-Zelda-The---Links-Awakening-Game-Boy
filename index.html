<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#c4c0b8">
    <title>Zelda: Link's Awakening DX - Kubo Touch</title>
    <style>
        :root {
            --gb-shell: #d4d0c8;
            --gb-shell-dark: #a8a39a;
            --gb-bezel: #3b3d47;
            --gb-screen-bg: #0f1712;
            --gb-accent-red: #b91c1c;
            --gb-accent-blue: #2563eb;
            --gb-neon: #4ade80;
            --ejs-primary-color: #4ade80;
            --ejs-background-color: #090d0a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background: radial-gradient(circle at top, #e2dfd7 0%, #bcb7ae 100%);
            color: #1f2937;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Topo estilo carcaça de cartucho Game Boy */
        .cartridge-top {
            width: 100%;
            max-width: 540px;
            padding: 8px 14px 6px;
            background: linear-gradient(180deg, #e5e2da 0%, #c8c4bc 100%);
            border-bottom: 3px solid #9e9990;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .cartridge-grip {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 44px;
        }

        .cartridge-grip span {
            height: 2px;
            width: 100%;
            background: #9c978e;
            border-radius: 2px;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.4px;
            color: #18181b;
            text-transform: uppercase;
        }

        .gbc-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e, #3b82f6);
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.6px;
        }

        .game-label {
            font-size: 11px;
            font-weight: 700;
            color: #374151;
            max-width: 145px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-align: right;
        }

        /* Área principal do jogo */
        #game-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 540px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        /* Tela de capa no estilo adesivo de cartucho Game Boy */
        #cartridge-cover-overlay {
            position: absolute;
            inset: 10px;
            border-radius: 14px;
            background: linear-gradient(160deg, #2b2d36 0%, #17181f 100%);
            border: 3px solid #8f8a81;
            box-shadow:
                inset 0 0 0 3px #3e414d,
                0 12px 28px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 14px 14px 18px;
            z-index: 30;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #cartridge-cover-overlay.hidden {
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }

        .sticker-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111217;
            border: 2px solid #525666;
            border-radius: 6px;
            padding: 5px 10px;
        }

        .sticker-console {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #e5e7eb;
            text-transform: uppercase;
        }

        .sticker-console span {
            color: #facc15;
        }

        .sticker-dx {
            font-size: 10px;
            font-weight: 800;
            color: #4ade80;
            letter-spacing: 1px;
        }

        .cover-art-frame {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 3 / 2;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #d4d0c8;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.55);
            background: #09090b;
        }

        .cover-art-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cover-title-box {
            text-align: center;
            padding: 0 6px;
        }

        .cover-title-box h1 {
            font-size: clamp(16px, 4.5vw, 21px);
            font-weight: 900;
            color: #f9fafb;
            letter-spacing: 0.4px;
            line-height: 1.2;
        }

        .cover-title-box p {
            margin-top: 4px;
            font-size: 12px;
            color: #cbd5e1;
        }

        .play-btn {
            width: 100%;
            max-width: 320px;
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #14532d, 0 8px 16px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .play-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #14532d, 0 4px 10px rgba(0, 0, 0, 0.35);
        }

        /* Rodapé estilo parte inferior do cartucho */
        .cartridge-bottom {
            width: 100%;
            max-width: 540px;
            padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, #c8c4bc 0%, #b5b0a7 100%);
            border-top: 2px solid #9e9990;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 10px;
            font-weight: 700;
            color: #3f3f46;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            z-index: 20;
        }

        .power-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 6px rgba(239, 68, 68, 0.7);
        }

        /* Ajustes de cores para botões virtuais do EmulatorJS no celular */
        .ejs_virtualGamepad_button {
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45), 0 6px 12px rgba(0, 0, 0, 0.3) !important;
            font-weight: 900 !important;
        }
    </style>
</head>
<body>

    <header class="cartridge-top">
        <div class="cartridge-grip" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="brand-badge">
            KUBO TOUCH
            <span class="gbc-pill">GBC</span>
        </div>
        <div class="game-label">Link's Awakening DX</div>
    </header>

    <main id="game-wrapper">
        <div id="cartridge-cover-overlay">
            <div class="sticker-header">
                <div class="sticker-console">GAME BOY <span>COLOR</span></div>
                <div class="sticker-dx">DX EDITION</div>
            </div>

            <div class="cover-art-frame">
                <img src="gbc_legendofzeldalinksawakeningdx_3_2.jpg" alt="Capa do cartucho The Legend of Zelda: Link's Awakening DX">
            </div>

            <div class="cover-title-box">
                <h1>The Legend of Zelda: Link's Awakening DX</h1>
                <p>Toque no botão abaixo para iniciar no celular</p>
            </div>

            <button type="button" class="play-btn" id="start-game-btn">▶ Jogar Agora</button>
        </div>

        <div id="game"></div>
    </main>

    <footer class="cartridge-bottom">
        <span class="power-led" aria-hidden="true"></span>
        <span>Kubo Touch • Compatível com qualquer celular</span>
    </footer>

    <script>
        const startBtn = document.getElementById('start-game-btn');
        const coverOverlay = document.getElementById('cartridge-cover-overlay');

        // Configurações do EmulatorJS
        EJS_player = '#game';
        EJS_core = 'gb';
        EJS_gameName = "The Legend of Zelda - Link's Awakening DX";
        EJS_color = '#4ade80';
        EJS_startOnLoaded = false;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Nome exato do arquivo .gbc no repositório
        EJS_gameUrl = 'Legend of Zelda, The - Links Awakening DX (USA, Europe) (Rev 2) (SGB Enhanced) (GB Compatible).gbc';
        EJS_backgroundImage = 'gbc_legendofzeldalinksawakeningdx_3_2.jpg';

        // Controles virtuais adaptados para telas de celular (D-Pad, A, B, Select e Start)
        EJS_VirtualGamepadSettings = [
            {
                type: 'dpad',
                location: 'left',
                left: '16px',
                bottom: '28px',
                size: 126
            },
            {
                type: 'button',
                text: 'A',
                id: 'a',
                location: 'right',
                right: '18px',
                bottom: '74px',
                size: 58,
                color: '#b91c1c'
            },
            {
                type: 'button',
                text: 'B',
                id: 'b',
                location: 'right',
                right: '86px',
                bottom: '34px',
                size: 58,
                color: '#b91c1c'
            },
            {
                type: 'button',
                text: 'SELECT',
                id: 'select',
                location: 'center',
                left: '33%',
                bottom: '12px',
                width: 62,
                height: 24,
                fontSize: 9
            },
            {
                type: 'button',
                text: 'START',
                id: 'start',
                location: 'center',
                right: '33%',
                bottom: '12px',
                width: 62,
                height: 24,
                fontSize: 9
            }
        ];

        // Inicia o jogo ao tocar na capa/botão (melhora o áudio e o carregamento no celular)
        startBtn.addEventListener('click', () => {
            coverOverlay.classList.add('hidden');
            if (window.EJS_emulator && typeof window.EJS_emulator.start === 'function') {
                window.EJS_emulator.start();
            }
        });
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
