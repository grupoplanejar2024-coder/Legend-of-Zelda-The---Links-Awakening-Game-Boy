<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#c8c4bc">
    <title>Zelda: Link's Awakening DX - Kubo Touch</title>
    <style>
        :root {
            --gb-light: #dedad2;
            --gb-mid: #c4c0b8;
            --gb-dark: #8f8a81;
            --gb-bezel: #3b3d47;
            --gb-screen: #121714;
            --gb-red: #b91c1c;
            --gb-green: #22c55e;
            --ejs-primary-color: #22c55e;
            --ejs-background-color: #0b0e0c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100dvh;
            background: radial-gradient(circle at top, #e7e4dc 0%, #b8b3aa 100%);
            color: #18181b;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        /* Cabeçalho estilo topo de cartucho Game Boy */
        .gb-header {
            width: 100%;
            max-width: 540px;
            padding: 8px 14px;
            background: linear-gradient(180deg, #e8e5dd 0%, #c6c2ba 100%);
            border-bottom: 3px solid var(--gb-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }

        .gb-ribs {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 38px;
        }

        .gb-ribs span {
            height: 2px;
            background: #969188;
            border-radius: 2px;
        }

        .gb-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1.3px;
            text-transform: uppercase;
        }

        .gb-badge {
            font-size: 10px;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ef4444, #eab308, #22c55e, #3b82f6);
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        }

        .gb-rom-tag {
            font-size: 11px;
            font-weight: 800;
            color: #3f3f46;
            background: rgba(255, 255, 255, 0.55);
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        /* Container principal */
        #game-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 540px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #game {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
        }

        /* Tela inicial intuitiva estilo Game Boy */
        #gb-start-screen {
            position: absolute;
            inset: 10px;
            border-radius: 16px;
            background: linear-gradient(180deg, var(--gb-light) 0%, var(--gb-mid) 100%);
            border: 3px solid var(--gb-dark);
            box-shadow:
                inset 0 2px 0 rgba(255, 255, 255, 0.7),
                0 12px 26px rgba(0, 0, 0, 0.25);
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 30;
            transition: opacity 0.28s ease, transform 0.28s ease;
        }

        #gb-start-screen.hidden {
            opacity: 0;
            transform: scale(0.97);
            pointer-events: none;
        }

        /* Moldura escura da tela do Game Boy */
        .gb-screen-bezel {
            flex: 1;
            background: var(--gb-bezel);
            border-radius: 14px 14px 36px 14px;
            padding: 10px 12px 14px;
            border: 2px solid #272930;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 8px;
            min-height: 0;
        }

        .gb-bezel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .gb-power-indicator {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: #d1d5db;
            text-transform: uppercase;
        }

        .gb-led {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            box-shadow: 0 0 8px #ef4444;
        }

        .gb-bezel-lines {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .gb-bezel-lines span {
            height: 2px;
            border-radius: 2px;
        }

        .gb-bezel-lines span:first-child {
            background: #991b1b;
        }

        .gb-bezel-lines span:last-child {
            background: #1e3a8a;
        }

        /* Área da capa / cartucho */
        .gb-display-window {
            flex: 1;
            background: var(--gb-screen);
            border-radius: 8px;
            border: 2px solid #1f2421;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 0;
            overflow: hidden;
        }

        .cart-visual-box {
            position: relative;
            height: 100%;
            max-height: 235px;
            aspect-ratio: 1 / 1.05;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-visual-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }

        .fallback-cartridge {
            display: none;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #d8d4cc 0%, #b5b0a6 100%);
            border: 2px solid #858077;
            border-radius: 10px 26px 8px 8px;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55);
        }

        .fallback-cartridge.active {
            display: flex;
        }

        .fallback-top-groove {
            border: 2px solid #9c978e;
            border-radius: 14px;
            padding: 4px 8px;
            text-align: center;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #4b4842;
        }

        .fallback-label {
            flex: 1;
            margin: 8px 4px 4px;
            background: linear-gradient(135deg, #b89428 0%, #8a6b14 55%, #6d7275 55%, #55595c 100%);
            border: 2px solid #3f3d38;
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
        }

        .fallback-label small {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fde047;
            margin-bottom: 4px;
        }

        .fallback-label strong {
            font-size: 13px;
            line-height: 1.15;
            font-weight: 900;
        }

        .fallback-label span {
            margin-top: 5px;
            font-size: 10px;
            font-weight: 900;
            background: #dc2626;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .gb-game-info {
            text-align: center;
            color: #f9fafb;
        }

        .gb-game-info h1 {
            font-size: clamp(15px, 4.2vw, 19px);
            font-weight: 900;
            line-height: 1.2;
        }

        .gb-game-info p {
            margin-top: 3px;
            font-size: 11px;
            color: #9ca3af;
        }

        /* Painel inferior de ação */
        .gb-action-area {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .gb-start-btn {
            width: 100%;
            max-width: 340px;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 5px 0 #14532d, 0 8px 16px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .gb-start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #14532d, 0 4px 10px rgba(0, 0, 0, 0.25);
        }

        .gb-hint {
            font-size: 10.5px;
            font-weight: 700;
            color: #4b5563;
        }

        /* Rodapé */
        .gb-footer {
            width: 100%;
            max-width: 540px;
            padding: 6px 14px calc(8px + env(safe-area-inset-bottom));
            background: linear-gradient(180deg, #c6c2ba 0%, #b3aea4 100%);
            border-top: 2px solid var(--gb-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 800;
            color: #3f3f46;
            letter-spacing: 0.7px;
            text-transform: uppercase;
            z-index: 20;
        }

        .ejs_virtualGamepad_button {
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45), 0 6px 12px rgba(0, 0, 0, 0.3) !important;
            font-weight: 900 !important;
        }
    </style>
</head>
<body>

    <header class="gb-header">
        <div class="gb-ribs" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="gb-brand">
            KUBO TOUCH
            <span class="gb-badge">GB / GBC</span>
        </div>
        <div class="gb-rom-tag">ZELDA DX</div>
    </header>

    <main id="game-wrapper">
        <section id="gb-start-screen" aria-label="Tela inicial do cartucho">
            <div class="gb-screen-bezel">
                <div class="gb-bezel-top">
                    <div class="gb-power-indicator">
                        <span class="gb-led" aria-hidden="true"></span>
                        <span>BATTERY</span>
                    </div>
                    <div class="gb-bezel-lines" aria-hidden="true">
                        <span></span>
                        <span></span>
                    </div>
                </div>

                <div class="gb-display-window">
                    <div class="cart-visual-box">
                        <img
                            id="cart-img"
                            src="cartucho-zelda-dx.jpg"
                            alt="Cartucho Game Boy The Legend of Zelda: Link's Awakening DX"
                            onerror="handleCartImageError(this)"
                        >
                        <div id="fallback-cart" class="fallback-cartridge" aria-hidden="true">
                            <div class="fallback-top-groove">GAME BOY</div>
                            <div class="fallback-label">
                                <small>THE LEGEND OF</small>
                                <strong>ZELDA<br>LINK'S AWAKENING</strong>
                                <span>DX</span>
                            </div>
                        </div>
                    </div>

                    <div class="gb-game-info">
                        <h1>The Legend of Zelda: Link's Awakening DX</h1>
                        <p>Cartucho inserido • Controles na tela para celular</p>
                    </div>
                </div>
            </div>

            <div class="gb-action-area">
                <button type="button" class="gb-start-btn" id="start-game-btn">▶ Iniciar Jogo</button>
                <div class="gb-hint">D-Pad à esquerda • Botões A e B à direita</div>
            </div>
        </section>

        <div id="game"></div>
    </main>

    <footer class="gb-footer">
        <span>Kubo Touch • Game Boy &amp; Game Boy Color</span>
    </footer>

    <script>
        const startBtn = document.getElementById('start-game-btn');
        const startScreen = document.getElementById('gb-start-screen');
        const fallbackCart = document.getElementById('fallback-cart');

        function handleCartImageError(img) {
            const step = Number(img.dataset.fallbackStep || 0);
            if (step === 0) {
                img.dataset.fallbackStep = '1';
                img.src = 'gbc_legendofzeldalinksawakeningdx_3_2.jpg';
            } else {
                img.style.display = 'none';
                fallbackCart.classList.add('active');
            }
        }

        // Configurações do EmulatorJS
        EJS_player = '#game';
        EJS_core = 'gb';
        EJS_gameName = "The Legend of Zelda - Link's Awakening DX";
        EJS_color = '#22c55e';
        EJS_startOnLoaded = false;
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

        // Nome exato do arquivo .gbc no repositório
        EJS_gameUrl = 'Legend of Zelda, The - Links Awakening DX (USA, Europe) (Rev 2) (SGB Enhanced) (GB Compatible).gbc';
        EJS_backgroundImage = 'cartucho-zelda-dx.jpg';

        // Controles virtuais para celular
        EJS_VirtualGamepadSettings = [
            {
                type: 'dpad',
                location: 'left',
                left: '16px',
                bottom: '28px',
                size: 126
            },
            {
                type: 'button',
                text: 'A',
                id: 'a',
                location: 'right',
                right: '18px',
                bottom: '74px',
                size: 58,
                color: '#b91c1c'
            },
            {
                type: 'button',
                text: 'B',
                id: 'b',
                location: 'right',
                right: '86px',
                bottom: '34px',
                size: 58,
                color: '#b91c1c'
            },
            {
                type: 'button',
                text: 'SELECT',
                id: 'select',
                location: 'center',
                left: '33%',
                bottom: '12px',
                width: 62,
                height: 24,
                fontSize: 9
            },
            {
                type: 'button',
                text: 'START',
                id: 'start',
                location: 'center',
                right: '33%',
                bottom: '12px',
                width: 62,
                height: 24,
                fontSize: 9
            }
        ];

        startBtn.addEventListener('click', () => {
            startScreen.classList.add('hidden');
            if (window.EJS_emulator && typeof window.EJS_emulator.start === 'function') {
                window.EJS_emulator.start();
            }
        });
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
